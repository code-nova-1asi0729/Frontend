<mat-toolbar>
  <span class="brand">Vigilia</span>
  <span class="spacer"></span>
  @for (option of options(); track option.link) {
    <a mat-button [routerLink]="option.link" routerLinkActive="active">
      {{ option.label | translate }}
    </a>
  }
  <app-language-switcher />
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
