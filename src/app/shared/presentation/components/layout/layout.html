<mat-sidenav-container class="shell">
  <mat-sidenav
    class="sidebar"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="!isCompact()"
    [fixedInViewport]="isCompact()"
  >
    <a class="brand" routerLink="/home" (click)="closeIfCompact()">
      <span class="brand-logo"><mat-icon>monitor_heart</mat-icon></span>
      <span class="brand-name">Vigilia</span>
    </a>

    <nav class="nav" [attr.aria-label]="'layout.navigation' | translate">
      @for (option of options(); track option.link) {
        <a
          class="nav-item"
          [routerLink]="option.link"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeIfCompact()"
        >
          <mat-icon class="nav-icon">{{ option.icon }}</mat-icon>
          <span>{{ option.label | translate }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="topbar">
      @if (isCompact()) {
        <button
          mat-icon-button
          [attr.aria-label]="'layout.open-menu' | translate"
          (click)="sidenav()?.open()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span class="topbar-title">Vigilia</span>
      }
      <app-language-switcher class="language" />
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
